<text x="240" y="310" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" xml:space="preserve"><tspan fill="#c2185b" font-weight="700" fill-opacity="0">SELECT</tspan><tspan fill="#333333" fill-opacity="0"> ProductName, CategoryName</tspan></text>
<text x="240" y="337" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" xml:space="preserve"><tspan fill="#c2185b" font-weight="700">FROM</tspan><tspan fill="#333333"> Products </tspan><tspan fill="#c2185b" font-weight="700">JOIN</tspan><tspan fill="#333333"> Categories</tspan></text>
<text x="240" y="364" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" xml:space="preserve"><tspan fill="#c2185b" font-weight="700" fill-opacity="0">  ON</tspan><tspan fill="#333333" fill-opacity="0"> Products.CategoryID = Categories.CategoryID</tspan></text>
