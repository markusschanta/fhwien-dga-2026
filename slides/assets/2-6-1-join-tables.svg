<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" role="img"><title>JOIN: zwei Tabellen, passende Zeilen über CategoryID, zusammengeführtes Ergebnis</title>
